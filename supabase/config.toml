# Disposable local Supabase stack for Auth, PostgREST and Realtime E2E.
# No remote project ref, access token, JWT secret or production credentials.
project_id = "alkkagi-e2e-local"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true
