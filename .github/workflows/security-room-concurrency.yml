name: PostgreSQL room creation race

on:
  push:
    branches: ['feat/security-s1-rpc-guard']
    paths:
      - 'tests/security-room-concurrency.sql'
      - 'supabase/migrations/202610290004_security_room_create_limits.sql'
      - '.github/workflows/security-room-concurrency.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/security-room-concurrency.sql'
      - 'supabase/migrations/202610290004_security_room_create_limits.sql'
      - '.github/workflows/security-room-concurrency.yml'

permissions:
  contents: read

jobs:
  independent-postgres-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Exercise real concurrent PostgreSQL sessions
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f tests/security-room-concurrency.sql
