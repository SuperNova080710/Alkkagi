name: Omok board real-browser QA

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, 'release/v0.3.0', 'release/v0.3.1']
    paths:
      - '.github/workflows/omok-board-browser.yml'
      - 'scripts/qa/omok-board-browser.mjs'
      - 'src/components/omok/**'
      - 'src/app/arena.css'
      - 'src/app/globals.css'
      - 'src/app/omok/**'

permissions:
  contents: read

concurrency:
  group: omok-ui-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyboard-and-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Confirm installed Chromium
        run: command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Create CI-only client fixture (never committed or deployed)
        shell: bash
        run: |
          mkdir -p src/app/omok-browser-qa-fixture
          cat > src/app/omok-browser-qa-fixture/page.tsx <<'EOF'
          'use client';
          import { useEffect, useState } from 'react';
          import { type OmokPosition, type OmokStone } from '@/components/omok/omok-board-view';
          import { OmokMatchPanel, OmokChatPanel } from '@/components/omok/omok-match-panels';
          import { ArenaShell } from '@/components/ui/arena';

          type Cell = OmokStone | null;
          function initial(): Cell[][] {
            const board: Cell[][] = Array.from({ length: 15 }, () => Array<Cell>(15).fill(null));
            board[7][7] = 'black';
            return board;
          }
          export default function OmokQaPage() {
            const [board, setBoard] = useState<Cell[][]>(initial);
            const [moves, setMoves] = useState<OmokPosition[]>([]);
            const [lastMove, setLastMove] = useState<OmokPosition>({ row: 7, col: 7 });
            useEffect(() => {
              document.documentElement.dataset.omokQaReady = 'true';
              return () => { delete document.documentElement.dataset.omokQaReady; };
            }, []);
            function place(move: OmokPosition) {
              if (board[move.row]?.[move.col] !== null) return;
              setMoves(prev => [...prev, move]);
              setBoard(prev => prev.map((row, rowNo) =>
                rowNo === move.row ? row.map((cell, colNo) => colNo === move.col ? 'white' : cell) : row));
              setLastMove(move);
            }
            // Match pages use this exact shell/header/footer + back-link structure.
            // No Supabase credentials: only the gameplay snapshot is fixture data.
            return <ArenaShell current="lobby" account={<button type="button">로그아웃</button>}>
              <div className="arena-omok-overview arena-omok-live-stack">
                <a href="/omok" className="arena-button arena-button--outline">← 오목 로비</a>
                <div className="arena-omok-live-stack">
                  <OmokMatchPanel board={board} lastMove={lastMove}
                    players={[{ id: 'me', nickname: '테스트', stone: 'white' },
                      { id: 'other', nickname: '상대', stone: 'black' }]}
                    currentUserId="me" turnUserId="me" status="active"
                    onPlace={place} onForfeit={() => {}} onReturn={() => {}}
                    chat={<OmokChatPanel currentUserId="me" messages={[]}
                      onSend={async () => true}/>}/>
                </div>
                <output id="qa-moves" hidden aria-label="테스트 착수 기록">{JSON.stringify(moves)}</output>
              </div>
            </ArenaShell>;
          }
          EOF
      - name: Create CI-only ranked leaderboard fixture with 100 long usernames
        shell: bash
        run: |
          mkdir -p src/app/omok-ranked-width-qa
          cat > src/app/omok-ranked-width-qa/page.tsx <<'EOF'
          import { ArenaShell } from '@/components/ui/arena';
          import { ArenaPanel } from '@/components/ui/arena-panel';
          import { GameSwitcher } from '@/components/lobby/game-switcher';
          import { OmokRankedLeaderboard } from '@/components/omok/omok-ranked-client';
          const rows = Array.from({ length: 100 }, (_, i) => ({
            position: i + 1,
            nickname: i % 2 === 0
              ? '엄청나게긴오목플레이어닉네임가나다라마바사아자차카타파하'+i
              : 'really-long-omok-player-nickname-without-any-spaces-'+i,
            rating: 1_234_567 + i, wins: i * 3, losses: i, draws: 5,
          }));
          export default function RankedWidthFixture() {
            return <ArenaShell current="ranked" game="omok">
              <div className="arena-service arena-service--ranked">
                <GameSwitcher current="omok" section="ranked"/>
                <header className="arena-service-heading">
                  <div><p className="arena-section-kicker">OMOK · RANKED ARENA</p>
                    <h1>한 판씩, 더 높은 곳으로.</h1></div>
                </header>
                <div className="arena-service-name"><strong>테스트 사용자</strong></div>
                <div className="arena-stats">
                  <ArenaPanel title="나의 오목 RP"><p>1,234,567</p></ArenaPanel>
                  <ArenaPanel title="매칭 상태"><p>대기 안 함</p></ArenaPanel>
                  <ArenaPanel title="랭크 제한"><p>90초</p></ArenaPanel>
                </div>
                <div className="arena-ranked-main">
                  <div className="arena-service-controls">
                    <ArenaPanel title="랜덤 랭크 매칭"><p>대기 안 함</p></ArenaPanel>
                  </div>
                  <div className="arena-ranking-grid">
                    <ArenaPanel title="리더보드 TOP 100"><OmokRankedLeaderboard rows={rows}/></ArenaPanel>
                    <ArenaPanel title="오목 랭크 안내"><p>오목 RP는 알까기 RP와 별개입니다.</p></ArenaPanel>
                  </div>
                </div>
              </div>
            </ArenaShell>;
          }
          EOF
      - name: Create CI-only ranked match viewport and no-chat fixture
        shell: bash
        run: |
          mkdir -p src/app/omok-ranked-match-qa
          cat > src/app/omok-ranked-match-qa/page.tsx <<'EOF'
          'use client';
          import { useEffect, useState } from 'react';
          import { ArenaShell } from '@/components/ui/arena';
          import { OmokMatchPanel, OmokChatPanel } from '@/components/omok/omok-match-panels';
          import type { OmokPosition, OmokStone } from '@/components/omok/omok-board-view';
          import '@/components/omok/omok-live.css';
          type Cell = OmokStone | null;
          const initial = (): Cell[][] => {
            const b = Array.from({length:15}, () => Array<Cell>(15).fill(null));
            b[7][7] = 'black';
            return b;
          };
          export default function RankedMatchQaPage() {
            const [board, setBoard] = useState<Cell[][]>(initial);
            const [moves, setMoves] = useState<OmokPosition[]>([]);
            useEffect(() => {
              document.documentElement.dataset.omokQaReady='true';
              return () => {delete document.documentElement.dataset.omokQaReady;};
            }, []);
            function place(move: OmokPosition) {
              if (board[move.row]?.[move.col] !== null) return;
              setMoves(v => [...v, move]);
              setBoard(old => old.map((row,r) => r === move.row
                ? row.map((cell,col) => col === move.col ? 'white' : cell) : row));
            }
            const rankedMeta = <section className="arena-omok-live-panel arena-omok-ranked-meta" aria-label="오목 랭크 시간·정산">
              <div><strong>남은 턴 시간 90초</strong>
                <p className="arena-omok-panel-hint">서버 시각과 다를 수 있으며, 시간 초과 여부는 서버가 확정합니다.</p></div>
              <div><strong>오목 RP 정산 확인 중</strong></div>
              <button type="button" className="arena-button arena-button--outline">랭크 상태 갱신</button>
            </section>;
            return <ArenaShell current="ranked" game="omok" account={<button type="button">로그아웃</button>}>
              <div className="arena-omok-overview arena-omok-overview--ranked arena-omok-live-stack">
                <a className="arena-button arena-button--outline" href="/omok/ranked">← 오목 랭크 로비</a>
                <div className="arena-omok-live-stack arena-omok-live-stack--ranked">
                  <OmokMatchPanel board={board} lastMove={{row:7,col:7}}
                    players={[{id:'me',nickname:'랭크 플레이어',stone:'white'},
                      {id:'other',nickname:'상대',stone:'black'}]}
                    currentUserId="me" turnUserId="me" status="active"
                    mode="ranked" onPlace={place} onForfeit={() => {}} onReturn={() => {}}
                    extra={rankedMeta}
                    chat={<OmokChatPanel messages={[]} currentUserId="me" onSend={async()=>true}/>}
                  />
                </div>
                <output id="qa-ranked-moves" hidden>{JSON.stringify(moves)}</output>
              </div>
            </ArenaShell>;
          }
          EOF
      - name: Build Next.js production fixture
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify actual match shell / vertical scroll / 15x15 keyboard in real Chrome
        run: node scripts/qa/omok-board-browser.mjs
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          QA_OUTPUT_DIR: artifacts/omok-board-qa
      - name: Upload non-sensitive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omok-ui-browser-${{ github.run_id }}
          path: artifacts/omok-board-qa/
          retention-days: 7
          if-no-files-found: warn
