name: Omok board real-browser QA

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, 'release/v0.3.0']
    paths:
      - '.github/workflows/omok-board-browser.yml'
      - 'scripts/qa/omok-board-browser.mjs'
      - 'src/components/omok/**'
      - 'src/app/arena.css'
      - 'src/app/globals.css'
      - 'src/app/omok/**'

permissions:
  contents: read

concurrency:
  group: omok-ui-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyboard-and-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Confirm installed Chromium
        run: command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Create CI-only client fixture (never committed or deployed)
        shell: bash
        run: |
          mkdir -p src/app/omok-browser-qa-fixture
          cat > src/app/omok-browser-qa-fixture/page.tsx <<'EOF'
          'use client';
          import { useEffect, useState } from 'react';
          import { type OmokPosition, type OmokStone } from '@/components/omok/omok-board-view';
          import { OmokMatchPanel, OmokChatPanel } from '@/components/omok/omok-match-panels';
          import { ArenaShell } from '@/components/ui/arena';

          type Cell = OmokStone | null;
          function initial(): Cell[][] {
            const board: Cell[][] = Array.from({ length: 15 }, () => Array<Cell>(15).fill(null));
            board[7][7] = 'black';
            return board;
          }
          export default function OmokQaPage() {
            const [board, setBoard] = useState<Cell[][]>(initial);
            const [moves, setMoves] = useState<OmokPosition[]>([]);
            const [lastMove, setLastMove] = useState<OmokPosition>({ row: 7, col: 7 });
            useEffect(() => {
              document.documentElement.dataset.omokQaReady = 'true';
              return () => { delete document.documentElement.dataset.omokQaReady; };
            }, []);
            function place(move: OmokPosition) {
              if (board[move.row]?.[move.col] !== null) return;
              setMoves(prev => [...prev, move]);
              setBoard(prev => prev.map((row, rowNo) =>
                rowNo === move.row ? row.map((cell, colNo) => colNo === move.col ? 'white' : cell) : row));
              setLastMove(move);
            }
            // Match pages use this exact shell/header/footer + back-link structure.
            // No Supabase credentials: only the gameplay snapshot is fixture data.
            return <ArenaShell current="lobby" account={<button type="button">로그아웃</button>}>
              <div className="arena-omok-overview arena-omok-live-stack">
                <a href="/omok" className="arena-button arena-button--outline">← 오목 로비</a>
                <div className="arena-omok-live-stack">
                  <OmokMatchPanel board={board} lastMove={lastMove}
                    players={[{ id: 'me', nickname: '테스트', stone: 'white' },
                      { id: 'other', nickname: '상대', stone: 'black' }]}
                    currentUserId="me" turnUserId="me" status="active"
                    onPlace={place} onForfeit={() => {}} onReturn={() => {}}
                    chat={<OmokChatPanel currentUserId="me" messages={[]}
                      onSend={async () => true}/>}/>
                </div>
                <output id="qa-moves" hidden aria-label="테스트 착수 기록">{JSON.stringify(moves)}</output>
              </div>
            </ArenaShell>;
          }
          EOF
      - name: Build Next.js production fixture
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify actual match shell / vertical scroll / 15x15 keyboard in real Chrome
        run: node scripts/qa/omok-board-browser.mjs
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          QA_OUTPUT_DIR: artifacts/omok-board-qa
      - name: Upload non-sensitive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omok-ui-browser-${{ github.run_id }}
          path: artifacts/omok-board-qa/
          retention-days: 7
          if-no-files-found: warn
