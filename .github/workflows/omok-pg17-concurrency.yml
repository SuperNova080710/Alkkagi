name: Omok PostgreSQL 17 isolated RPC and concurrency

on:
  push:
    branches: ['feat/220-omok-db-core', 'feat/221-omok-api']
    paths:
      - 'supabase/migrations/202611030001_omok_casual_core.sql'
      - 'supabase/migrations/202611030002_omok_social_and_rematch.sql'
      - 'tests/omok-pg17-concurrency.sql'
      - '.github/workflows/omok-pg17-concurrency.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'supabase/migrations/202611030001_omok_casual_core.sql'
      - 'supabase/migrations/202611030002_omok_social_and_rematch.sql'
      - 'tests/omok-pg17-concurrency.sql'
      - '.github/workflows/omok-pg17-concurrency.yml'
permissions:
  contents: read
jobs:
  disposable-pg17-omok:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate local DB host and PostgreSQL major version
        env:
          PGHOST: '127.0.0.1'
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = postgres
          actual=$(psql -X -At -v ON_ERROR_STOP=1 -c 'show server_version_num')
          test "$actual" -ge 170000
          test "$actual" -lt 180000
          psql -X -v ON_ERROR_STOP=1 -f tests/omok-pg17-concurrency.sql
