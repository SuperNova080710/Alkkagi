name: PostgreSQL 17 full migration rollout

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional full 40-character SHA from develop or release/v* (empty = selected ref HEAD)'
        type: string
        required: false
  push:
    branches: ['feat/ops-pg17-rollout', 'chore/ci-release-gates']
    paths:
      - 'tests/pg17-migration-rollout.sql'
      - 'supabase/migrations/**'
      - '.github/workflows/pg17-migration-rollout.yml'
  pull_request:
    branches: [develop, main]
    # No paths filter: an app-only release/v* -> main PR MUST run all gates.
    # The job if-condition below skips unrelated PRs without starting Docker.

permissions:
  contents: read

jobs:
  pg17-disposable-integration:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
          ((github.base_ref == 'main' && startsWith(github.head_ref, 'release/v')) ||
           (github.base_ref == 'develop' && startsWith(github.head_ref, 'chore/ci-'))))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Manual dispatch: obtain policy from the trusted default branch first.
      # The user-provided target_sha is NEVER checked out or executed here.
      - name: Checkout trusted policy from main
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .release-policy
          fetch-depth: 0
          persist-credentials: false
      - name: Validate manual SHA using trusted policy before target checkout
        if: github.event_name == 'workflow_dispatch'
        id: validate
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
        working-directory: .release-policy
        run: bash scripts/ci/validate-release-target.sh
      - name: Checkout verified target or PR merge commit
        uses: actions/checkout@v4
        with:
          # Never derive a checkout ref directly from unverified user input.
          ref: ${{ steps.validate.outputs.target_sha || github.sha }}
          fetch-depth: 0
      - name: Install PostgreSQL client (disposable DB only)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Enforce isolated test connection
        shell: bash
        env:
          PGHOST: '127.0.0.1'
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = postgres
          actual=$(psql -X -At -v ON_ERROR_STOP=1 -c 'show server_version_num')
          echo "Disposable PostgreSQL version: $actual"
          test "$actual" -ge 170000
          test "$actual" -lt 180000
          psql -X -v ON_ERROR_STOP=1 -f tests/pg17-migration-rollout.sql
