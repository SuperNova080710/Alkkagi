name: Supabase local Auth + Realtime integration E2E

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional full 40-character SHA from develop or release/v* (empty = selected ref HEAD)'
        type: string
        required: false
  push:
    branches: ['feat/ops-supabase-local-e2e', 'chore/ci-release-gates']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'tests/e2e/supabase-local.mjs'
      - '.github/workflows/supabase-local-e2e.yml'
  pull_request:
    branches: [develop, main]
    # No paths filter: an app-only release/v* -> main PR MUST run all gates.
    # The job if-condition below skips unrelated PRs without starting Docker.

permissions:
  contents: read

jobs:
  local-supabase:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
          ((github.base_ref == 'main' && startsWith(github.head_ref, 'release/v')) ||
           (github.base_ref == 'develop' && startsWith(github.head_ref, 'chore/ci-'))))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Do not attach an Actions environment, organization secrets or remote DB.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    steps:
      # Manual dispatch: obtain policy from the trusted default branch first.
      # The user-provided target_sha is NEVER checked out or executed here.
      - name: Checkout trusted policy from main
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .release-policy
          fetch-depth: 0
          persist-credentials: false
      - name: Validate manual SHA using trusted policy before target checkout
        if: github.event_name == 'workflow_dispatch'
        id: validate
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
        working-directory: .release-policy
        run: bash scripts/ci/validate-release-target.sh
      - name: Remove trusted policy staging checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: rm -rf -- .release-policy
      - name: Checkout verified target or PR merge commit
        uses: actions/checkout@v4
        with:
          # Never derive a checkout ref directly from unverified user input.
          ref: ${{ steps.validate.outputs.target_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Assert remote API and DB endpoints fail before any client is created
        shell: bash
        run: |
          set -euo pipefail
          # The script validates both endpoints BEFORE reading credentials.
          if API_URL=http://e2e.invalid:54321 DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres \
             node tests/e2e/supabase-local.mjs > /tmp/e2e-guard.log 2>&1; then
            echo "::error::Remote API was not rejected."
            exit 1
          fi
          grep -q 'Refusing any non-loopback Supabase host' /tmp/e2e-guard.log
          if API_URL=http://127.0.0.1:54321 DB_URL=postgresql://postgres:postgres@e2e.invalid:54322/postgres \
             node tests/e2e/supabase-local.mjs > /tmp/e2e-guard.log 2>&1; then
            echo "::error::Remote DB was not rejected."
            exit 1
          fi
          grep -q 'Refusing remote PostgreSQL' /tmp/e2e-guard.log
          rm -f /tmp/e2e-guard.log
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Start disposable Supabase (local Docker only)
        shell: bash
        run: |
          set -euo pipefail
          # No supabase login/link/db push, and no database URL or service key
          # from GitHub secrets. The CLI starts the local stack from config.toml.
          supabase start -x studio,imgproxy,postgres-meta,storage-api,edge-runtime,logflare,vector,supavisor > /tmp/supabase-e2e-start.log 2>&1 || {
            echo "::error::Local Supabase failed to start; check local Docker and SQL migrations."
            # CLI output may contain locally generated keys; do not print it.
            exit 1
          }
          echo "Supabase local Auth/PostgREST/Realtime stack is ready."
      - name: Export ONLY ephemeral local test endpoints to this step
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/alkkagi-local-test.env
          chmod 600 /tmp/alkkagi-local-test.env
          # The status is generated by local Docker; fail before exporting any
          # values that point outside local loopback.
          set -a
          source /tmp/alkkagi-local-test.env
          set +a
          node -e '
            const u=new URL(process.env.API_URL||"");
            const d=new URL(process.env.DB_URL||"");
            if(u.origin!=="http://127.0.0.1:54321" ||
               d.hostname!=="127.0.0.1" || d.port!=="54322" ||
               d.pathname!=="/postgres") process.exit(1);
          '
          node tests/e2e/supabase-local.mjs
      - name: Remove disposable Supabase volumes
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup > /dev/null 2>&1 || true
          rm -f /tmp/alkkagi-local-test.env /tmp/supabase-e2e-start.log /tmp/e2e-guard.log
